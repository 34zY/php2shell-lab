; Verification lab php.ini
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 0

; Force an update on every multipart event. The CLI server buffers the
; request body, so a network stall alone does not create a second update.
session.upload_progress.freq = 0
session.upload_progress.min_freq = 0

session.save_path = "/tmp/uaf-sess"
session.use_strict_mode = 0

memory_limit = 128M
display_errors = 1
log_errors = 0
